<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Fiche de Paie</title>
    <style>
      .A4 {
        width: 18cm;
        height: 29.7cm;
        margin: auto;
        background: white;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        font-family: 'Times New Roman', Times, serif;
      }
      .A4 header h1 {
        text-align: center;
      }
      .A4 .info {
        display: flex;
        justify-content: space-between;
        margin: 20px;
      }
      .A4 .info div p {
        margin: 4px 0;
        font-size: 16px;
      }
      .A4 h3 {
        margin-top: 10px;
        margin-bottom: 10px;
      }

      .A4 table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      .A4 .table-title {
        text-align: center;
      }
      .A4 table tbody td:last-child {
        text-align: right;
      }

      .A4 th, .A4 td {
        border: 1px solid #aaa;
        padding: 10px;
        text-align: left;
      }
      .A4 th {
        background-color: #f2f2f2;
      }
      .A4 .summary {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
      }

      .A4 .summary table {
        width: 50%;
      }
      .A4 .summary td {
        text-align: right;
      }
      .A4 .summary td:first-child {
        text-align: left;
      }
      .A4 .ttlwords {
        text-align: right;
        font-style: italic;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <div class="A4">
      <header>
        <h1>FICHE DE PAIE</h1>
      </header>

      <div class="info">  
        <div>
          <p><strong>EMPLOYEE :</strong> <span  th:text="${salary_Slip.employee}"></span></p>
          <p><strong>EMPLOYEE NAME : </strong><span th:text="${salary_Slip.employee_name}"></span></p>
          <p><strong>COMPANY :</strong> <span th:text="${salary_Slip.company}"></span></p>
        </div>
        <div>
          <p><strong>START DATE :</strong> <span  th:text="${salary_Slip.start_date}"></span></p>
          <p><strong>END DATE :</strong> <span th:text="${salary_Slip.end_date}"></span></p>
          <p><strong>WORKING DAYS :</strong> <span  th:text="${salary_Slip.total_working_days}+' days'"></span></p>
        </div>
      </div>

      <h3>SALARY COMPONENTS ***</h3>
      <h4 class="table-title">EARNINGS DETAILS</h4>
      <table>
        <thead>
          <tr>
            <th>SALARY COMPONENT</th>
            <th>ABRR</th>
            <th>AMOUNT</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="earn : ${salary_Slip.earnings}">
            <td th:text="${earn.salary_component}"></td>
            <td th:text="${earn.abbr}"></td>
            <td th:text="${earn.amount+' '+salary_Slip.currency}"></td>
          </tr>
        </tbody>
      </table>

      <h4 class="table-title">DEDUCTIONS DETAILS</h4>
      <table>
        <thead>
          <tr>
            <th>SALARY COMPONENT</th>
            <th>ABRR</th>
            <th>AMOUNT</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="deduction: ${salary_Slip.deductions}">
            <td  th:text="${deduction.salary_component}"></td>
            <td  th:text="${deduction.abbr}"></td>
            <td  th:text="${deduction.amount+' '+salary_Slip.currency}"></td>
          </tr>
        </tbody>
      </table>

      <div class="summary">
        <table>
          <tr>
            <td><strong>GROSS PAY :</strong></td>
            <td  th:text="${salary_Slip.gross_pay+' '+salary_Slip.currency}"></td>
          </tr>
          <tr>
            <td><strong>TOTAL DEDUCTIONS :</strong></td>
            <td th:text="${salary_Slip.total_deduction+' '+salary_Slip.currency}"></td>
          </tr>
          <tr>
            <td><strong>NET PAY :</strong></td>
            <td><strong th:text="${salary_Slip.net_pay+' '+salary_Slip.currency}"></strong></td>
          </tr>
        </table>
      </div>

      <div class="ttlwords">
        TOTAL IN WORDS : <strong th:text="${salary_Slip.total_in_words}"></strong>
      </div>

    </div>

  </body>
</html>
